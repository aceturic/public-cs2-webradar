<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS2 RADAR</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;1,400&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0d1012;
            --ct-color: #9ac2ff;
            --t-color: #e4c264;
            --c4-color: #ef4444;
            --smoke-color: rgba(180, 180, 180, 0.6);
            --fire-color: rgba(255, 100, 50, 0.6);
            --text-main: #eeeeee;
            --text-dim: #8899a6;
        }

        * { box-sizing: border-box; user-select: none; }
        
        body {
            margin: 0;
            height: 100vh;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 50%, rgba(30, 40, 50, 0.8) 0%, #0d1012 100%);
            font-family: 'Rajdhani', sans-serif;
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, transparent 100%);
            z-index: 10;
        }
        .session-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 14px;
            letter-spacing: 1px;
            backdrop-filter: blur(4px);
        }
        .highlight { color: #fff; font-weight: 700; }

        .hud-container {
            flex: 1;
            display: grid;
            grid-template-columns: 280px 1fr 280px;
            padding: 20px;
            gap: 20px;
            overflow: hidden;
        }

        .team-column {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 10px;
        }
        
        .team-header {
            font-family: 'Barlow Condensed', sans-serif;
            font-size: 32px;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 10px;
            opacity: 0.4;
        }

        .player-card {
            position: relative;
            height: 55px;
            background: rgba(15, 19, 24, 0.85);
            backdrop-filter: blur(8px);
            border-radius: 4px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            gap: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .t-side .player-card { border-right: 3px solid var(--t-color); flex-direction: row; }
        .ct-side .player-card { border-left: 3px solid var(--ct-color); flex-direction: row-reverse; }
        .player-card.dead { opacity: 0.5; filter: grayscale(0.8); }
        .player-card.local { background: rgba(255, 255, 255, 0.1); border-color: #fff; }

        .p-info { display: flex; flex-direction: column; justify-content: center; flex: 1; z-index: 2; }
        .t-side .p-info { align-items: flex-end; text-align: right; }
        .ct-side .p-info { align-items: flex-start; text-align: left; }

        .p-name { font-size: 16px; font-weight: 700; line-height: 1; margin-bottom: 4px; color: #fff; }
        .p-weapon { font-size: 12px; font-weight: 500; color: var(--text-dim); text-transform: uppercase; }
        
        .p-stat-box { display: flex; flex-direction: column; align-items: center; min-width: 30px; }
        .hp-text { font-size: 18px; font-weight: 700; font-family: 'Barlow Condensed'; }
        
        .money { color: #4ade80; font-size: 14px; font-weight: bold; margin-left: 6px; text-shadow: 0 0 5px rgba(74, 222, 128, 0.4); }

        .hp-bg-fill { position: absolute; bottom: 0; left: 0; height: 3px; width: 100%; background: rgba(0,0,0,0.5); z-index: 1; }
        .hp-bar { height: 100%; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }

        .map-wrapper { position: relative; display: flex; justify-content: center; align-items: center; border-radius: 12px; background: radial-gradient(circle, rgba(20,20,20,0.5) 0%, rgba(0,0,0,0) 70%); }
        canvas { border-radius: 8px; box-shadow: 0 0 50px rgba(0,0,0,0.5); image-rendering: -webkit-optimize-contrast; }

        .controls { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: flex; background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(10px); padding: 5px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); gap: 5px; }
        .ctrl-btn { background: transparent; border: none; color: var(--text-dim); padding: 8px 16px; font-family: 'Rajdhani', sans-serif; font-weight: 600; text-transform: uppercase; cursor: pointer; border-radius: 4px; transition: 0.2s; }
        .ctrl-btn:hover { color: #fff; background: rgba(255,255,255,0.05); }
        .ctrl-btn.active { background: #fff; color: #000; box-shadow: 0 0 10px rgba(255,255,255,0.2); }

        #login-screen { position: absolute; inset: 0; z-index: 999; background: rgba(5, 7, 10, 0.95); display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-card { background: linear-gradient(145deg, #1a1d21, #141619); padding: 40px 60px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 20px 50px rgba(0,0,0,0.5); text-align: center; }
        .login-title { font-family: 'Barlow Condensed'; font-size: 24px; letter-spacing: 4px; color: var(--text-dim); margin-bottom: 30px; }
        #room-input { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; color: #fff; font-family: 'Rajdhani'; font-size: 32px; text-align: center; letter-spacing: 8px; width: 100%; padding: 10px; margin-bottom: 20px; outline: none; text-transform: uppercase; }
        #join-btn { width: 100%; padding: 15px; background: var(--t-color); color: #000; font-weight: 700; border: none; font-size: 16px; letter-spacing: 1px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <div class="login-title">RADAR LINK</div>
            <input type="text" id="room-input" placeholder="CODE" maxlength="5" autocomplete="off">
            <button id="join-btn">ESTABLISH CONNECTION</button>
        </div>
    </div>

    <div class="top-bar">
        <div class="session-badge">
            <span style="color:var(--text-dim)">SESSION</span> <span id="session-code" class="highlight">---</span> 
            <span style="color:var(--text-dim); margin-left:10px;">MAP</span> <span id="map-name" class="highlight">---</span>
        </div>
    </div>

    <div class="hud-container">
        <div class="team-column t-side">
            <div class="team-header" style="color:var(--t-color)">Terrorists</div>
            <div id="list-t" style="width:100%"></div>
        </div>

        <div class="map-wrapper" id="map-container">
            <canvas id="radar-canvas"></canvas>
        </div>

        <div class="team-column ct-side">
            <div class="team-header" style="color:var(--ct-color)">Counter-Terrorists</div>
            <div id="list-ct" style="width:100%"></div>
        </div>
    </div>

    <div class="controls">
        <button class="ctrl-btn" id="btn-fullmap">Map View</button>
        <button class="ctrl-btn active" id="btn-radar">Player View</button>
        <button class="ctrl-btn" onclick="resetView()">Reset</button>
    </div>

<script>
    const canvas = document.getElementById('radar-canvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const listT = document.getElementById('list-t');
    const listCT = document.getElementById('list-ct');
    
    let view = { x: 0, y: 0, scale: 1.0, isDragging: false, lastX: 0, lastY: 0 };
    let activeRoomCode = null, isFullMap = false, isFetching = false;
    let dpiScale = window.devicePixelRatio || 1;

    let currentMapName = "";
    let mapImage = new Image();
    let isMapLoaded = false;
    let localData = { x: 0, y: 0, yaw: 0, team: 0 };
    let entityCache = {}; 
    let c4Data = null;
    let droppedWeapons = []; 
    let activeGrenades = []; 

    const MAP_DATA = {
        "de_mirage": { file: "maps/de_mirage.png", pos_x: -3230, pos_y: 1713, scale: 5.0 },
        "de_dust2":  { file: "maps/de_dust2.png",  pos_x: -2476, pos_y: 3239, scale: 4.4 },
        "de_inferno":{ file: "maps/de_inferno.png",pos_x: -2087, pos_y: 3870, scale: 4.9 },
        "de_nuke":   { file: "maps/de_nuke.png",   pos_x: -3453, pos_y: 2887, scale: 7.0 },
        "de_vertigo":{ file: "maps/de_vertigo.png",pos_x: -3168, pos_y: 1762, scale: 4.0 },
        "de_ancient":{ file: "maps/de_ancient.png",pos_x: -2953, pos_y: 2164, scale: 5.0 },
        "de_anubis": { file: "maps/de_anubis.png", pos_x: -2796, pos_y: 3328, scale: 5.22 },
        "cs_office": { file: "maps/cs_office.png", pos_x: -1838, pos_y: 1858, scale: 4.1 }
    };

    function resizeCanvas() {
        const wrapper = canvas.parentElement;
        canvas.width = wrapper.offsetWidth * dpiScale;
        canvas.height = wrapper.offsetHeight * dpiScale;
        canvas.style.width = wrapper.offsetWidth + "px";
        canvas.style.height = wrapper.offsetHeight + "px";
        ctx.scale(dpiScale, dpiScale);
        resetView();
    }
    window.addEventListener('resize', resizeCanvas);
    
    document.getElementById('join-btn').addEventListener('click', () => {
        const code = document.getElementById('room-input').value.trim().toUpperCase();
        if(code.length > 0) {
            activeRoomCode = code;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('session-code').innerText = code;
            resizeCanvas();
            startDataLoop();
            requestAnimationFrame(renderLoop);
        }
    });

    const btnFull = document.getElementById('btn-fullmap');
    const btnRadar = document.getElementById('btn-radar');
    btnFull.addEventListener('click', () => { isFullMap = true; toggleView(); resetView(); });
    btnRadar.addEventListener('click', () => { isFullMap = false; toggleView(); resetView(); });
    function toggleView() {
        btnFull.className = isFullMap ? "ctrl-btn active" : "ctrl-btn";
        btnRadar.className = !isFullMap ? "ctrl-btn active" : "ctrl-btn";
    }

    const wrapper = document.getElementById('map-container');
    wrapper.addEventListener('mousedown', e => { if(isFullMap) { view.isDragging=true; view.lastX=e.offsetX; view.lastY=e.offsetY; wrapper.style.cursor='grabbing'; }});
    window.addEventListener('mouseup', () => { view.isDragging=false; wrapper.style.cursor='default'; });
    wrapper.addEventListener('mousemove', e => { if(view.isDragging && isFullMap) { view.x+=e.offsetX-view.lastX; view.y+=e.offsetY-view.lastY; view.lastX=e.offsetX; view.lastY=e.offsetY; }});
    wrapper.addEventListener('wheel', e => { e.preventDefault(); const f = 1 + (e.deltaY > 0 ? -0.1 : 0.1); view.scale = Math.max(0.1, Math.min(view.scale * f, 10)); });

    function resetView() {
        view.x = 0; view.y = 0; view.scale = 1.0;
        if(isFullMap && isMapLoaded) {
            const w = canvas.width / dpiScale;
            const h = canvas.height / dpiScale;
            view.scale = Math.min(w / mapImage.width, h / mapImage.height) * 0.9;
        }
    }

    function startDataLoop() {
        if (!activeRoomCode) return;
        if (isFetching) return;
        isFetching = true;

        fetch('get_data.php?id=' + activeRoomCode + '&t=' + Date.now())
            .then(r => r.json())
            .then(data => {
                if(data && data.l) {
                    processData(data);
                }
            })
            .catch(e => {})
            .finally(() => {
                isFetching = false;
                setTimeout(startDataLoop, 60); 
            });
    }

    function processData(data) {
        if (data.m && data.m !== currentMapName) {
            currentMapName = data.m;
            document.getElementById('map-name').innerText = currentMapName.toUpperCase();
            if (MAP_DATA[currentMapName]) {
                mapImage.src = MAP_DATA[currentMapName].file;
                mapImage.onload = () => { isMapLoaded = true; if(isFullMap) resetView(); };
            }
        }

        if (data.d) droppedWeapons = data.d; else droppedWeapons = [];
        if(data.c4) c4Data = data.c4; else c4Data = null;
        
        if(data.g) activeGrenades = data.g; else activeGrenades = [];

        const seenIds = new Set();
        localData.targetX = data.l.x; localData.targetY = data.l.y; localData.yaw = data.l.a; localData.team = data.l.t; localData.name = data.l.n;
        if(localData.x === undefined || localData.x === 0) { localData.x = data.l.x; localData.y = data.l.y; }

        (data.e || []).forEach((ent, idx) => {
            const id = ent.n + idx; seenIds.add(id);
            if (!entityCache[id]) entityCache[id] = { x: ent.x, y: ent.y, targetX: ent.x, targetY: ent.y };
            entityCache[id].targetX = ent.x; entityCache[id].targetY = ent.y; 
            entityCache[id].yaw = ent.yaw || ent.a || 0; 
            entityCache[id].team = ent.t; entityCache[id].name = ent.n;
            entityCache[id].health = ent.h; entityCache[id].weapon = ent.w; entityCache[id].money = ent.m;
        });

        for (let id in entityCache) { if (!seenIds.has(id)) delete entityCache[id]; }
        renderSidebar(data);
    }

    function renderSidebar(data) {
        let players = (data.e || []).map((ent, idx) => ({...ent, isLocal: false}));
        if(data.l) players.push({n: data.l.n, t: data.l.t, h: data.l.h, w: data.l.w, m: data.l.m, isLocal: true});
        players.sort((a, b) => b.h - a.h);

        let tHtml = '', ctHtml = '';
        players.forEach(ent => {
            let moneyStr = (ent.m !== undefined && ent.m !== null) ? `<span class="money">$${ent.m}</span>` : "";
            let hpCol = ent.h > 50 ? "#4ade80" : (ent.h > 20 ? "#facc15" : "#ef4444");
            const card = `
            <div class="player-card ${ent.h<=0?'dead':''} ${ent.isLocal?'local':''}">
                <div class="p-info">
                    <div class="p-name">${ent.n} ${moneyStr}</div>
                    <div class="p-weapon">${ent.w||'KNIFE'}</div>
                </div>
                <div class="p-stat-box"><span class="hp-text" style="color:${ent.h<=0?'#555':hpCol}">${ent.h}</span></div>
                <div class="hp-bg-fill"><div class="hp-bar" style="width:${ent.h}%; background-color:${hpCol}"></div></div>
            </div>`;
            if (ent.t === 2) tHtml += card; else if (ent.t === 3) ctHtml += card;
        });
        listT.innerHTML = tHtml; listCT.innerHTML = ctHtml;
    }

    function renderLoop() {
        requestAnimationFrame(renderLoop);
        const w = canvas.width / dpiScale;
        const h = canvas.height / dpiScale;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = "#111"; ctx.fillRect(0,0,w,h); 

        const mapConfig = MAP_DATA[currentMapName];
        if (!mapConfig || !isMapLoaded) return;

        const smooth = 0.15;
        localData.x += (localData.targetX - localData.x) * smooth;
        localData.y += (localData.targetY - localData.y) * smooth;
        for(let id in entityCache) {
            let ent = entityCache[id];
            ent.x += (ent.targetX - ent.x) * smooth; ent.y += (ent.targetY - ent.y) * smooth;
        }

        const worldToMap = (wx, wy) => ({
            x: (wx - mapConfig.pos_x) / mapConfig.scale,
            y: (mapConfig.pos_y - wy) / mapConfig.scale
        });

        const cx = w / 2, cy = h / 2;
        ctx.save();
        
        if (isFullMap) {
            ctx.translate(cx + view.x, cy + view.y);
            ctx.scale(view.scale, view.scale);
            ctx.drawImage(mapImage, -mapImage.width/2, -mapImage.height/2);

            if(activeGrenades) {
                activeGrenades.forEach(g => {
                    const p = worldToMap(g.x, g.y);
                    drawGrenade(p.x - mapImage.width/2, p.y - mapImage.height/2, g);
                });
            }

            if(droppedWeapons) {
                droppedWeapons.forEach(w => {
                    const wp = worldToMap(w.x, w.y);
                    drawWeaponLabel(wp.x - mapImage.width/2, wp.y - mapImage.height/2, w.n, 0);
                });
            }

            if(c4Data) { const p = worldToMap(c4Data.x, c4Data.y); drawC4(p.x - mapImage.width/2, p.y - mapImage.height/2); }
            for(let id in entityCache) { const ent = entityCache[id]; const p = worldToMap(ent.x, ent.y); drawPlayer(p.x - mapImage.width/2, p.y - mapImage.height/2, ent.team, false, ent.yaw, null, ent.name); }
            const lp = worldToMap(localData.x, localData.y); drawPlayer(lp.x - mapImage.width/2, lp.y - mapImage.height/2, localData.team, true, localData.yaw, null, localData.name);

        } else {
            const lPos = worldToMap(localData.x, localData.y);
            const rotRad = (localData.yaw - 90) * (Math.PI / 180);
            
            ctx.translate(cx, cy);
            ctx.rotate(-rotRad); 
            ctx.scale(view.scale, view.scale);
            ctx.drawImage(mapImage, -lPos.x, -lPos.y);

            if(activeGrenades) {
                activeGrenades.forEach(g => {
                    const p = worldToMap(g.x, g.y);
                    drawGrenade(p.x - lPos.x, p.y - lPos.y, g);
                });
            }

            if(droppedWeapons) {
                droppedWeapons.forEach(w => {
                    const wp = worldToMap(w.x, w.y);
                    drawWeaponLabel(wp.x - lPos.x, wp.y - lPos.y, w.n, rotRad);
                });
            }

            if(c4Data) { const p = worldToMap(c4Data.x, c4Data.y); drawC4(p.x - lPos.x, p.y - lPos.y); }
            for(let id in entityCache) { const ent = entityCache[id]; const p = worldToMap(ent.x, ent.y); drawPlayer(p.x - lPos.x, p.y - lPos.y, ent.team, false, ent.yaw, localData.yaw, ent.name); }
            
            ctx.restore(); ctx.save(); ctx.translate(cx, cy); 
            drawPlayer(0, 0, localData.team, true, 0, null, localData.name);
        }
        ctx.restore();
    }

    function drawGrenade(x, y, nade) {
        ctx.save();
        ctx.translate(x, y);
        
        let color = "#fff";
        let radius = 10;
        
        if (nade.type === "smoke") {
            color = "rgba(180, 180, 180, 0.5)";
            radius = 18; 
        } else if (nade.type === "fire") {
            color = "rgba(255, 80, 0, 0.5)";
            radius = 14;
        }

        const pulse = 1 + Math.sin(Date.now() / 200) * 0.1;
        
        ctx.beginPath();
        ctx.arc(0, 0, radius * pulse, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 1;
        ctx.stroke();

        if (nade.max_time > 0 && nade.time_left > 0) {
            const pct = nade.time_left / nade.max_time;
            ctx.beginPath();
            ctx.arc(0, 0, radius + 4, -Math.PI / 2, (-Math.PI / 2) + (Math.PI * 2 * pct));
            ctx.strokeStyle = (nade.type === "fire") ? "#ff0000" : "#cccccc";
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        ctx.restore();
    }

    function drawWeaponLabel(x, y, name, rotation) {
        if(!name) return;
        if(name.includes("decoy") || name.includes("flash") || name.includes("smoke") || name.includes("hegrenade") || name.includes("molotov")) return; 

        ctx.save();
        if(rotation !== 0 && rotation != null) {
            ctx.translate(x, y);
            ctx.rotate(rotation); 
            ctx.translate(-x, -y);
        }

        ctx.font = "bold 9px 'Rajdhani', sans-serif";
        const txt = name.toUpperCase();
        const metrics = ctx.measureText(txt);
        const w = metrics.width + 6;
        const h = 12;

        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
        ctx.fillRect(x - w/2, y - h/2, w, h);
        
        ctx.fillStyle = "#ffcc00"; 
        if(name.includes("awp") || name.includes("ak") || name.includes("m4")) ctx.fillStyle = "#ff0000";

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(txt, x, y + 1);

        ctx.restore();
    }

    function drawPlayer(x, y, team, isLocal, yaw, relativeYaw, name) {
        const color = isLocal ? "#fff" : (team === 2 ? "#e4c264" : "#9ac2ff");
        if (yaw !== null) {
            let angle = yaw;
            

            
            let drawAngleRad = 0;

            if (isFullMap) {

                drawAngleRad = (-angle) * (Math.PI / 180);
            } else {
                if (isLocal) {
                    drawAngleRad = -Math.PI / 2;
                } else {
          
                    drawAngleRad = (-angle) * (Math.PI / 180);
                }
            }

            const viewDist = 35;
            const grad = ctx.createLinearGradient(x, y, x + Math.cos(drawAngleRad)*viewDist, y + Math.sin(drawAngleRad)*viewDist);
            grad.addColorStop(0, color); grad.addColorStop(1, "transparent");
            
            ctx.beginPath(); 
            ctx.moveTo(x, y);
            ctx.lineTo(x + Math.cos(drawAngleRad - 0.5)*viewDist, y + Math.sin(drawAngleRad - 0.5)*viewDist);
            ctx.lineTo(x + Math.cos(drawAngleRad + 0.5)*viewDist, y + Math.sin(drawAngleRad + 0.5)*viewDist);
            ctx.fillStyle = grad; ctx.globalAlpha = 0.3; ctx.fill(); ctx.globalAlpha = 1.0;
        }
        
        ctx.beginPath(); ctx.arc(x, y, isLocal ? 7 : 5, 0, Math.PI * 2);
        ctx.fillStyle = color; ctx.shadowColor = color; ctx.shadowBlur = 10; ctx.fill(); ctx.shadowBlur = 0;
        ctx.strokeStyle = "rgba(0,0,0,0.5)"; ctx.lineWidth = 1; ctx.stroke();

        if(name) {
            ctx.save();
            if (!isFullMap && !isLocal) {
               const counterRot = (localData.yaw - 90) * (Math.PI / 180);
               ctx.translate(x, y); ctx.rotate(counterRot); ctx.translate(-x, -y);
            }
            
            ctx.font = "bold 11px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "bottom";
            ctx.strokeStyle = "#000"; ctx.lineWidth = 3; ctx.strokeText(name, x, y - 8);
            ctx.fillStyle = "#fff"; ctx.fillText(name, x, y - 8);
            ctx.restore();
        }
    }

    function drawC4(x, y) {
        if (!c4Data || !c4Data.active) return;

        ctx.save();
        const size = (Date.now() % 500 < 250) ? 14 : 12; 
        ctx.fillStyle = c4Data.defused ? "#00ff00" : "#ff0000"; 
        ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 15;
        
        ctx.beginPath();
        ctx.arc(x, y, size/2, 0, Math.PI*2);
        ctx.fill();
        ctx.shadowBlur = 0;

        if (!c4Data.defused && c4Data.time > 0) {
            if(!isFullMap) {
                const rotRad = (localData.yaw - 90) * (Math.PI / 180);
                ctx.translate(x, y); ctx.rotate(rotRad); ctx.translate(-x, -y);
            }

            const barW = 40; const barH = 4; const boxY = y - 20;
            ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(x - barW/2 - 2, boxY - 12, barW + 4, 18);
            ctx.font = "bold 10px 'Rajdhani'"; ctx.fillStyle = "#fff"; ctx.textAlign = "center";
            ctx.fillText(`${c4Data.site} - ${c4Data.time.toFixed(1)}s`, x, boxY - 4);
            ctx.fillStyle = "#333"; ctx.fillRect(x - barW/2, boxY + 2, barW, barH);
            let pct = Math.max(0, c4Data.time / c4Data.max_time);
            ctx.fillStyle = c4Data.defusing ? "#55aaff" : (c4Data.time < 5 ? "#ff0000" : (c4Data.time < 10 ? "#ffcc00" : "#00ff00"));
            ctx.fillRect(x - barW/2, boxY + 2, barW * pct, barH);
            if(c4Data.defusing) { ctx.strokeStyle = "#00ffff"; ctx.lineWidth = 1; ctx.strokeRect(x - barW/2, boxY + 2, barW, barH); }
        } 
        else if (c4Data.defused) {
            ctx.font = "bold 12px 'Rajdhani'"; ctx.fillStyle = "#00ff00"; ctx.textAlign = "center"; ctx.fillText("DEFUSED", x, y - 15);
        }
        ctx.restore();
    }
</script>
